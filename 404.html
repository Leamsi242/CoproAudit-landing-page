<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · CoproAudit</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#ffffff 0%,#f5f5f7 55%,#ffffff 100%);color:#1d1d1f;font-family:"SF Pro Text",-apple-system,"Helvetica Neue",system-ui,sans-serif;text-align:center;padding:28px}
.card{max-width:460px}
.mk{width:56px;height:56px;border-radius:16px;margin:0 auto 26px;position:relative;background:linear-gradient(105deg,#0071e3 0%,#42a5f5 100%);box-shadow:0 14px 34px -12px rgba(0,113,227,.55)}
.mk::after{content:"";position:absolute;inset:16px;border-radius:5px;border:3px solid rgba(255,255,255,.92);border-bottom-color:transparent;border-right-color:transparent;transform:rotate(45deg)}
h1{font-family:"SF Pro Display",-apple-system,"Helvetica Neue",system-ui,sans-serif;font-size:clamp(28px,5vw,40px);letter-spacing:-.03em;font-weight:600;margin:0 0 12px;line-height:1.1}
p{color:#6e6e73;font-size:16px;line-height:1.6;margin:0 0 30px}
a.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:980px;background:linear-gradient(105deg,#0071e3 0%,#42a5f5 100%);color:#fff;text-decoration:none;font-weight:500;font-size:15px;box-shadow:0 10px 28px -10px rgba(0,113,227,.85);transition:filter .2s,transform .15s}
a.btn:hover{filter:brightness(1.08)}
a.btn:active{transform:translateY(1px)}
</style>
</head>
<body>
<div class="card">
  <div class="mk"></div>
  <h1>Cette page n’existe pas.</h1>
  <p>L’adresse demandée est introuvable. Tout le site CoproAudit se trouve sur la page d’accueil.</p>
  <a class="btn" id="home" href="/">Retour à l’accueil</a>
</div>
<script>
// Sur un site de projet GitHub Pages, la racine est /<repo>/ et non /
(function(){
  var seg=location.pathname.split('/')[1];
  if(location.hostname.endsWith('.github.io')&&seg){
    document.getElementById('home').href='/'+seg+'/';
  }
})();
</script>
</body>
</html>
